name: Shardguard Gate10 Android APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          test -d "$ANDROID_HOME"
          mkdir -p "$HOME/Android"
          ln -sfn "$ANDROID_HOME" "$HOME/Android/Sdk"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Warext Studios,C=TR" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1

      - name: Install Godot 4.7.1 and Android export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 2 -type f -name 'Godot_v4.7.1-stable_linux.x86_64' | head -1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          sudo ln -sf "$GODOT_BIN" /usr/local/bin/godot
          godot --version

          curl -fL --retry 3 -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          rm -rf /tmp/templates
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          TPL_DIR="$(dirname "$(find /tmp/templates -type f -name android_debug.apk | head -1)")"
          test -f "$TPL_DIR/android_debug.apk"
          DEST="$HOME/.local/share/godot/export_templates/4.7.1.stable"
          mkdir -p "$DEST"
          cp -a "$TPL_DIR"/. "$DEST"/
          test -f "$DEST/android_debug.apk"

      - name: Import and parse project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path .shardguard-build/compat --quit-after 5 2>&1 | tee /tmp/godot-import.log

      - name: Export Android debug APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          godot --headless --path .shardguard-build/compat \
            --export-debug "Android Debug" \
            "$GITHUB_WORKSPACE/out/Shardguard_FracturedSkies_v2.0.0_Android_Debug.apk" \
            2>&1 | tee /tmp/godot-export.log
          test -s out/Shardguard_FracturedSkies_v2.0.0_Android_Debug.apk

      - name: Verify APK structure and signature
        shell: bash
        run: |
          set -euxo pipefail
          APK="$GITHUB_WORKSPACE/out/Shardguard_FracturedSkies_v2.0.0_Android_Debug.apk"
          unzip -t "$APK"
          unzip -l "$APK" | tee out/apk-contents.txt
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee out/apksigner-verify.txt
          sha256sum "$APK" | tee out/Shardguard_FracturedSkies_v2.0.0_Android_Debug.apk.sha256
          stat -c '%n %s bytes' "$APK"

      - name: Upload verified Shardguard APK
        uses: actions/upload-artifact@v4
        with:
          name: Shardguard-FracturedSkies-v2.0.0-Android-Debug
          path: |
            out/Shardguard_FracturedSkies_v2.0.0_Android_Debug.apk
            out/Shardguard_FracturedSkies_v2.0.0_Android_Debug.apk.sha256
            out/apksigner-verify.txt
            out/apk-contents.txt
          if-no-files-found: error
          retention-days: 1
