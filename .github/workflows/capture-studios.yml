name: Capture Warext Studios Live Pages

on:
  push:
    branches: [main]
    paths:
      - 'tmp/capture-studios.js'
      - '.github/workflows/capture-studios.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser tools
        run: |
          npm init -y
          npm install playwright sharp
          npx playwright install --with-deps chromium

      - name: Capture live pages
        run: node tmp/capture-studios.js

      - name: Build ZIP
        run: zip -9 -r warext_studios_canli_sayfalar.zip studios-live-screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: warext-studios-live-screenshots
          path: |
            studios-live-screenshots/
            warext_studios_canli_sayfalar.zip
          if-no-files-found: error
          retention-days: 1
